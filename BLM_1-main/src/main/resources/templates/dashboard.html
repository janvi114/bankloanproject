<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nirmala Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .topbar { background: linear-gradient(135deg, #6f42c1, #8e6dc7); padding: 12px 0; }
        .navbar-brand { color: white !important; font-weight: 600; }
        .nav-link { color: rgba(255,255,255,0.9) !important; margin: 0 10px; font-weight: 500; }
        .nav-link:hover, .nav-link.active { color: white !important; background: rgba(255,255,255,0.1); border-radius: 4px; }
        .main-content { padding: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg topbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🏦 Nirmala Bank</a>
            <div class="navbar-nav mx-auto">
                <a class="nav-link active" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/customers}">Customers</a>
                <a class="nav-link" th:href="@{/loan-products}">Loan Products</a>
                <a class="nav-link" th:href="@{/loan-applications}">Applications</a>
                <a class="nav-link" th:href="@{/all-applications}">All Applications</a>
                <a class="nav-link" th:href="@{/reports}">Reports</a>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-link text-white">Sign Out</button>
            </form>
        </div>
    </nav>
    <main class="main-content">
        <div class="container-fluid py-5">
            <div class="row g-4">
                <div class="col-12">
                    <h2 class="mb-4 fw-bold text-dark">Dashboard Overview</h2>
                </div>

                <div class="col-md-3">
                    <div class="card card-hover shadow-sm rounded-4 border-0 h-100">
                        <div class="card-body d-flex flex-column align-items-start p-4">
                            <div class="d-flex w-100 justify-content-between align-items-center mb-3">
                                <h5 class="card-title text-muted fw-normal">Total Applications</h5>
                                <i class="bi bi-file-earmark-bar-graph fs-3 text-primary"></i>
                            </div>
                            <h1 class="display-4 fw-bold text-primary" th:text="${loanReport.totalApplications}">0</h1>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-hover shadow-sm rounded-4 border-0 h-100">
                        <div class="card-body d-flex flex-column align-items-start p-4">
                            <div class="d-flex w-100 justify-content-between align-items-center mb-3">
                                <h5 class="card-title text-muted fw-normal">Approved</h5>
                                <i class="bi bi-check-circle fs-3 text-success"></i>
                            </div>
                            <h1 class="display-4 fw-bold text-success" th:text="${loanReport.applicationsByStatus['APPROVED']}">0</h1>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-hover shadow-sm rounded-4 border-0 h-100">
                        <div class="card-body d-flex flex-column align-items-start p-4">
                            <div class="d-flex w-100 justify-content-between align-items-center mb-3">
                                <h5 class="card-title text-muted fw-normal">Pending</h5>
                                <i class="bi bi-hourglass-split fs-3 text-warning"></i>
                            </div>
                            <h1 class="display-4 fw-bold text-warning" th:text="${loanReport.applicationsByStatus['PENDING']}">0</h1>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-hover shadow-sm rounded-4 border-0 h-100">
                        <div class="card-body d-flex flex-column align-items-start p-4">
                            <div class="d-flex w-100 justify-content-between align-items-center mb-3">
                                <h5 class="card-title text-muted fw-normal">Rejected</h5>
                                <i class="bi bi-x-circle fs-3 text-danger"></i>
                            </div>
                            <h1 class="display-4 fw-bold text-danger" th:text="${loanReport.applicationsByStatus['REJECTED']}">0</h1>
                        </div>
                    </div>
                </div>

                <div class="col-12 mt-5">
                    <h3 class="h4 fw-bold text-dark">Quick Actions</h3>
                </div>
                <div class="col-md-4">
                    <a th:href="@{/loan-products/new}" class="text-decoration-none">
                        <div class="card card-hover shadow-sm rounded-4 border-0 h-100 bg-primary bg-opacity-75">
                            <div class="card-body text-white d-flex flex-column align-items-center justify-content-center py-5">
                                <i class="bi bi-plus-circle display-5 mb-2"></i>
                                <h5 class="card-title fw-bold">Create Loan Product</h5>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a th:href="@{/customers}" class="text-decoration-none">
                        <div class="card card-hover shadow-sm rounded-4 border-0 h-100 bg-success bg-opacity-75">
                            <div class="card-body text-white d-flex flex-column align-items-center justify-content-center py-5">
                                <i class="bi bi-person-plus display-5 mb-2"></i>
                                <h5 class="card-title fw-bold">View Customers</h5>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a th:href="@{/reports}" class="text-decoration-none">
                        <div class="card card-hover shadow-sm rounded-4 border-0 h-100 bg-info bg-opacity-75">
                            <div class="card-body text-white d-flex flex-column align-items-center justify-content-center py-5">
                                <i class="bi bi-bar-chart display-5 mb-2"></i>
                                <h5 class="card-title fw-bold">Generate Reports</h5>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
