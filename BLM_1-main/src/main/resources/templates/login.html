<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIRMALA BANK - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #495057;
            background-color: #f0f2f5;
            background-image: url('/assets/Bank-login-bg.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 41, 68, 0.85);
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            z-index: 1;
        }
        .logo-container {
            margin-bottom: 20px;
            color: #fff;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            background-color: rgba(255, 255, 255, 0.9);
        }
        .nav-tabs {
            border-bottom: none;
        }
        .nav-link {
            border: none;
            color: #495057;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .nav-link.active {
            background-color: transparent;
            border-bottom: 2px solid #122944;
            color: #122944;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #ced4da;
            transition: border-color 0.3s ease;
        }
        .form-control:focus {
            border-color: #122944;
            box-shadow: 0 0 0 0.25rem rgba(18, 41, 68, 0.25);
        }
        .btn-primary {
            background-color: #122944;
            border-color: #122944;
            width: 100%;
            font-weight: 500;
            border-radius: 8px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0d1a2c;
            border-color: #0d1a2c;
        }
        .forgot-password {
            font-size: 0.875rem;
            color: #122944;
            display: block;
            margin-bottom: 15px;
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .blue-link {
            color: #007bff;
            text-decoration: none;
        }
        .blue-link:hover {
            text-decoration: underline;
        }
        .alert {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-container">
            <h1 class="h4 mb-0 fw-bold">NIRMALA BANK</h1>
            <p class="text-white">Sign in to your account</p>
        </div>
        <div class="card p-4">
            <div th:if="${param.error}" class="alert alert-danger mb-3" role="alert">
                Invalid username or password
            </div>
            <div th:if="${param.logout}" class="alert alert-success mb-3" role="alert">
                You have been logged out successfully
            </div>
            <ul class="nav nav-tabs justify-content-center mb-4" id="loginTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab">Admin</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="customer-tab" data-bs-toggle="tab" data-bs-target="#customer" type="button" role="tab">Customer</button>
                </li>
            </ul>
            <div class="tab-content" id="loginTabContent">
                <div class="tab-pane fade show active" id="admin" role="tabpanel">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <input type="text" class="form-control" name="username" placeholder="Username" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" name="password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Sign In</button>
                    </form>
                </div>
                <div class="tab-pane fade" id="customer" role="tabpanel">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <input type="email" class="form-control" name="username" placeholder="Email address" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" name="password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Sign In</button>
                    </form>
                    <div class="mt-4 text-blue">
                        Don't have an account? 
                        <a th:href="@{/customer-register}" class="blue-link">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function confirmSignup() {
            return true;
        }
    </script>
</body>
</html>
